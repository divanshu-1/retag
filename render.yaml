services:
  - type: web
    name: retag-ml-service
    runtime: python
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MODEL_PATH
        value: models/pricing_model.joblib
      - key: PADDLE_PDX_CACHE_HOME
        value: /tmp/retag-paddlex-cache
      - key: PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK
        value: 'True'
